<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم Oxide</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@600;700&display=swap">
<style>
  :root{--bg:#F4F6F8;--card:#fff;--ink:#16212E;--ink-2:#5A6675;--ink-3:#8792A0;--line:#E3E8EE;--blue:#1E5AA8;--blue-d:#174A8C;--blue-t:#E8F0FA;--teal:#14B8A6;--danger:#B4232A;--warn:#9A5B00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6}
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
  .top{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .brand{font-family:"Readex Pro",sans-serif;font-weight:700;letter-spacing:.18em;direction:ltr;display:flex;gap:8px;align-items:center}
  .brand b{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--blue) 50%,var(--teal) 50%)}
  .brand small{letter-spacing:0;font-family:"IBM Plex Sans Arabic";font-weight:500;color:var(--ink-2)}
  .grow{flex:1}
  .tabs{max-width:960px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
  .tabs button{border:0;background:none;padding:10px 14px;font:inherit;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tabs button.on{color:var(--blue);border-color:var(--blue)}
  main{max-width:960px;margin:0 auto;padding:20px 16px 80px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .card + .card{margin-top:16px}
  .card h2{margin:0;font-size:18px;font-family:"Readex Pro",sans-serif}
  .head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
  input,textarea,select{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
  textarea{min-height:64px;resize:vertical}
  textarea.md{min-height:220px;font-family:"IBM Plex Mono",monospace;font-size:13.5px}
  .ltr{direction:ltr;text-align:left}
  .bi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bi > div{min-width:0}
  .bi small{display:block;font-size:12px;color:var(--ink-3);margin-bottom:3px}
  .item{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;background:#FBFCFD}
  .mini{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:end}
  .opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--blue-d)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
  .btn.danger{background:#fff;border:1.5px solid #EBC8C8;color:var(--danger)}
  .btn.sm{padding:5px 11px;font-size:13px}
  .muted{color:var(--ink-3);font-size:13.5px}
  .dirty{font-weight:600;color:var(--warn);font-size:14px}
  .notice{padding:12px 16px;border-radius:12px;background:#FFF4DC;color:#6B4416;margin-bottom:16px}
  .msg{margin-top:10px;font-size:14px;font-weight:600}
  .msg.ok{color:#0B7D71}.msg.err{color:var(--danger)}
  .toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:50;max-width:90vw}
  .toast.err{background:var(--danger)}
  ol.steps{margin:8px 0 0;padding-inline-start:22px;color:var(--ink-2);line-height:2}
  code{font-family:"IBM Plex Mono",monospace;background:var(--bg);padding:1px 6px;border-radius:4px;font-size:13px}
  @media (max-width:640px){.bi,.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="brand"><b></b>OXIDE <small>لوحة التحكم</small></span>
    <span class="grow"></span>
    <span class="dirty" id="dirty"></span>
    <a class="btn ghost" href="../" target="_blank" rel="noopener">عرض الموقع ↗</a>
    <button class="btn" id="save" disabled>حفظ ونشر</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-t="front" class="on">الواجهة</button>
    <button data-t="sections">أقسام الرئيسية</button>
    <button data-t="pages">الصفحات</button>
    <button data-t="contact">التواصل وآخر الصفحة</button>
    <button data-t="settings">الإعدادات</button>
  </nav>
</header>
<main id="ed"><p class="muted">جاري التحميل…</p></main>

<script>
(function () {
  var REPO = 'anasbq/Oxide.github.io', BRANCH = 'main', PATH = 'content.json', KEY = 'oxide_admin_token';
  var data = null, sha = null, dirty = false, tab = 'front';
  var ed = document.getElementById('ed'), saveBtn = document.getElementById('save');
  var store = {
    get: function () { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    set: function (v) { try { localStorage.setItem(KEY, v); } catch (e) {} },
    del: function () { try { localStorage.removeItem(KEY); } catch (e) {} }
  };

  function toast(m, err) { var t = el('div', 'toast' + (err ? ' err' : ''), m); document.body.append(t); setTimeout(function () { t.remove(); }, err ? 7000 : 4000); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function bt(text, cls, fn) { var b = el('button', 'btn ghost sm ' + (cls || ''), text); b.type = 'button'; b.onclick = fn; return b; }
  function mark() { dirty = true; saveBtn.disabled = !store.get(); document.getElementById('dirty').textContent = '● تعديلات ما انحفظت'; }
  addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------- GitHub ---------- */
  function gh(path, opts) {
    opts = opts || {};
    var h = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (store.get()) h.Authorization = 'Bearer ' + store.get();
    if (opts.body) h['Content-Type'] = 'application/json';
    return fetch('https://api.github.com/repos/' + REPO + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store' })
      .then(function (r) {
        if (opts.allow404 && r.status === 404) return null;
        if (r.status === 401) throw new Error('مفتاح GitHub غير صالح أو منتهي. حدّثه من «الإعدادات».');
        if (r.status === 403 || r.status === 404) throw new Error('المفتاح ما يقدر يكتب على ' + REPO + ' (لازم Contents: Read and write).');
        if (r.status === 409 || r.status === 422) throw new Error('الملف تغيّر من مكان ثاني. حدّث الصفحة وأعد التعديل.');
        if (!r.ok) throw new Error('رفض GitHub الطلب (' + r.status + ').');
        return r.json();
      });
  }
  var b64 = function (s) { return btoa(unescape(encodeURIComponent(s))); };
  var unb64 = function (s) { return decodeURIComponent(escape(atob(s.replace(/\n/g, '')))); };
  function load() {
    var go = store.get() ? gh('/contents/' + PATH + '?ref=' + BRANCH, { allow404: true }) : Promise.resolve(null);
    return go.then(function (f) {
      if (f) { sha = f.sha; return JSON.parse(unb64(f.content)); }
      return fetch('../content.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('ما لقيت content.json'); return r.json(); });
    });
  }
  saveBtn.onclick = function () {
    saveBtn.disabled = true; saveBtn.textContent = 'جاري النشر…';
    var body = { message: 'Update site content (admin)', content: b64(JSON.stringify(data, null, 1) + '\n'), branch: BRANCH };
    if (sha) body.sha = sha;
    gh('/contents/' + PATH, { method: 'PUT', body: body }).then(function (r) {
      sha = r.content.sha; dirty = false; document.getElementById('dirty').textContent = '';
      toast('انحفظ ✓ الموقع يتحدّث خلال دقيقة أو دقيقتين.');
    }).catch(function (e) { toast(e.message, true); saveBtn.disabled = false; })
      .then(function () { saveBtn.textContent = 'حفظ ونشر'; });
  };

  /* ---------- field builders ---------- */
  function bi(obj, key, label, kind) {
    if (!obj[key] || typeof obj[key] !== 'object') obj[key] = { en: '', ar: '' };
    var w = el('div'); w.append(el('label', '', label));
    var g = el('div', 'bi');
    ['en', 'ar'].forEach(function (l) {
      var d = el('div'); d.append(el('small', '', l === 'en' ? 'English' : 'عربي'));
      var i = el(kind ? 'textarea' : 'input', (l === 'en' ? 'ltr ' : '') + (kind === 'md' ? 'md' : ''));
      i.value = obj[key][l] || ''; i.oninput = function () { obj[key][l] = i.value; mark(); };
      d.append(i); g.append(d);
    });
    w.append(g); return w;
  }
  function plain(obj, key, label, cls, hint) {
    var w = el('div'); w.append(el('label', '', label));
    var i = el('input', cls || ''); i.value = obj[key] || ''; if (hint) i.placeholder = hint;
    i.oninput = function () { obj[key] = i.value; mark(); }; w.append(i); return w;
  }
  function select(obj, key, label, opts) {
    var w = el('div'); w.append(el('label', '', label));
    var s = el('select'); opts.forEach(function (o) { var op = el('option', '', o[1]); op.value = o[0]; s.append(op); });
    s.value = String(obj[key] == null ? opts[0][0] : obj[key]); s.onchange = function () { obj[key] = s.value === 'true' ? true : s.value === 'false' ? false : s.value; mark(); };
    w.append(s); return w;
  }
  function moveDel(arr, i, what) {
    var s = el('span', 'row');
    if (i > 0) s.append(bt('↑', '', function () { var x = arr[i]; arr[i] = arr[i - 1]; arr[i - 1] = x; mark(); draw(); }));
    if (i < arr.length - 1) s.append(bt('↓', '', function () { var x = arr[i]; arr[i] = arr[i + 1]; arr[i + 1] = x; mark(); draw(); }));
    s.append(bt('حذف', 'danger', function () { if (!confirm('تحذف ' + what + '؟')) return; arr.splice(i, 1); mark(); draw(); }));
    return s;
  }
  function card(title, extra) { var c = el('div', 'card'), h = el('div', 'head'); h.append(el('h2', '', title)); if (extra) h.append(extra); c.append(h); ed.append(c); return c; }
  function list(c, arr, label, make) {
    arr.forEach(function (x, i) { var it = el('div', 'item'), h = el('div', 'head'); h.append(el('b', '', label + ' ' + (i + 1))); h.append(moveDel(arr, i, 'هذا')); it.append(h); make(it, x, i); c.append(it); });
  }

  /* ---------- tabs ---------- */
  var VIEWS = {
    front: function () {
      data.site = data.site || { name: 'OXIDE' };
      var c = card('الموقع'); c.append(bi(data.site, 'description', 'وصف الموقع (يظهر في محركات البحث)', true));
      var h = data.hero = data.hero || {};
      c = card('أول الصفحة');
      c.append(bi(h, 'pill', 'الشارة الصغيرة فوق العنوان'), bi(h, 'title', 'العنوان الكبير (آخر كلمتين تطلع بالأزرق)'), bi(h, 'text', 'الوصف', true), bi(h, 'button', 'نص الزر'));
      data.ribbon = data.ribbon || [];
      c = card('الشريط الأزرق', bt('+ إضافة عبارة', '', function () { data.ribbon.push({ en: '', ar: '' }); mark(); draw(); }));
      list(c, data.ribbon, 'عبارة', function (it, x) { it.append(bi({ v: x }, 'v', 'النص')); });
    },
    sections: function () {
      data.sections = data.sections || [];
      ed.append(el('p', 'muted', 'هذي أقسام الصفحة الرئيسية بترتيبها. كل قسم له عنوان وعناصر (بطاقات أو خطوات).'));
      data.sections.forEach(function (s, si) {
        var c = card('قسم: ' + ((s.title && (s.title.ar || s.title.en)) || '(بدون عنوان)'), moveDel(data.sections, si, 'القسم كامل مع عناصره'));
        c.append(bi(s, 'title', 'العنوان'), bi(s, 'lead', 'سطر تحت العنوان (اختياري)', true), bi(s, 'badge', 'شارة جنب العنوان (اختياري، مثل «قيد التطوير»)'));
        var o = el('div', 'opts');
        o.append(select(s, 'layout', 'شكل العناصر', [['cards', 'بطاقات'], ['steps', 'خطوات مرقّمة'], ['text', 'نص فقط']]),
                 select(s, 'bg', 'الخلفية', [['white', 'أبيض'], ['grey', 'رمادي فاتح']]),
                 plain(s, 'id', 'رابط القسم', 'ltr', 'device'));
        c.append(o);
        s.items = s.items || [];
        list(c, s.items, 'عنصر', function (it, x) {
          var m = el('div', 'mini'); m.append(plain(x, 'icon', 'أيقونة', '', '🔬'), bi(x, 'title', 'العنوان')); it.append(m);
          it.append(bi(x, 'text', 'النص', true), bi(x, 'tag', 'وسم صغير (اختياري)'), plain(x, 'note', 'سطر صغير بخط ثابت (اختياري)', 'ltr'));
        });
        var add = el('div', 'row'); add.style.marginTop = '12px';
        add.append(bt('+ إضافة عنصر', '', function () { s.items.push({ icon: '', title: { en: '', ar: '' }, text: { en: '', ar: '' } }); mark(); draw(); }));
        c.append(add);
      });
      var c = card('قسم جديد'); c.append(bt('+ إضافة قسم', '', function () {
        data.sections.push({ id: 'section-' + (data.sections.length + 1), layout: 'cards', bg: 'white', title: { en: 'New section', ar: 'قسم جديد' }, items: [] }); mark(); draw();
        setTimeout(function () { scrollTo(0, document.body.scrollHeight); }, 0);
      }));
    },
    pages: function () {
      data.pages = data.pages || [];
      ed.append(el('p', 'muted', 'صفحات مستقلة مثل «عن Oxide» أو «الأسئلة الشائعة». النص يُكتب بـ Markdown: ## عنوان، - نقطة، **عريض**، [رابط](https://…)، ![صورة](رابط الصورة).'));
      data.pages.forEach(function (p, i) {
        var link = el('a', 'btn ghost sm', 'فتح ↗'); link.href = '../page.html?p=' + encodeURIComponent(p.slug || ''); link.target = '_blank';
        var ex = el('span', 'row'); ex.append(link, moveDel(data.pages, i, 'الصفحة'));
        var c = card('صفحة: ' + ((p.title && (p.title.ar || p.title.en)) || '(بدون عنوان)'), ex);
        var o = el('div', 'opts');
        o.append(plain(p, 'slug', 'الرابط (حروف إنجليزية وشرطات)', 'ltr', 'about'), select(p, 'nav', 'في القائمة العلوية؟', [['true', 'نعم'], ['false', 'لا']]));
        c.append(o, bi(p, 'title', 'العنوان'), bi(p, 'body', 'المحتوى (Markdown)', 'md'));
        c.querySelector('input.ltr').addEventListener('input', function (e) { p.slug = e.target.value.toLowerCase().replace(/[^a-z0-9-]+/g, '-'); });
      });
      var c = card('صفحة جديدة'); c.append(bt('+ إضافة صفحة', '', function () {
        data.pages.push({ slug: 'page-' + (data.pages.length + 1), nav: true, title: { en: 'New page', ar: 'صفحة جديدة' }, body: { en: '', ar: '' } }); mark(); draw();
        setTimeout(function () { scrollTo(0, document.body.scrollHeight); }, 0);
      }));
    },
    contact: function () {
      var p = data.pilot = data.pilot || { bullets: [] }; p.bullets = p.bullets || [];
      var c = card('قسم التواصل (انضم للتجربة)');
      c.append(bi(p, 'title', 'العنوان'), bi(p, 'text', 'النص', true), plain(p, 'email', 'الإيميل (يظهر لو النموذج ما اشتغل)', 'ltr'),
        plain(p, 'form_url', 'رابط استقبال نموذج التسجيل (Google Apps Script). اتركه فاضي عشان يظهر الإيميل بدل النموذج', 'ltr', 'https://script.google.com/macros/s/…/exec'),
        plain(p, 'sheet_url', 'رابط جدول المسجّلين (لك أنت بس، ما يظهر في الموقع)', 'ltr', 'https://docs.google.com/spreadsheets/…'));
      if (p.sheet_url) { var sl = el('a', 'btn ghost sm', '📋 افتح جدول المسجّلين ↗'); sl.href = p.sheet_url; sl.target = '_blank'; sl.style.marginTop = '10px'; c.append(sl); }
      c = card('النقاط تحت الإيميل (لما ما يكون فيه نموذج)', bt('+ إضافة نقطة', '', function () { p.bullets.push({ en: '', ar: '' }); mark(); draw(); }));
      list(c, p.bullets, 'نقطة', function (it, x) { it.append(bi({ v: x }, 'v', 'النص')); });
      c = card('آخر الصفحة'); c.append(bi(data, 'footer', 'السطر الأخير'));
    },
    settings: function () {
      var c = card('مفتاح GitHub');
      c.append(el('p', 'muted', 'اللوحة تحفظ تعديلاتك في مستودع ' + REPO + ' عن طريق مفتاح منك. المفتاح يبقى في هذا المتصفح فقط.'));
      var ol = el('ol', 'steps');
      ol.innerHTML = '<li>افتح <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">صفحة إنشاء مفتاح Fine-grained</a>.</li>' +
        '<li>في «Repository access» اختر <b>Only select repositories</b> ثم <b>Oxide.github.io</b>.</li>' +
        '<li>في «Permissions» خلّ <b>Contents</b> على <b>Read and write</b>، وأنشئ المفتاح وانسخه.</li>';
      c.append(ol);
      var w = el('div'); w.append(el('label', '', 'المفتاح'));
      var i = el('input', 'ltr'); i.type = 'password'; i.placeholder = 'github_pat_…'; i.autocomplete = 'off'; w.append(i); c.append(w);
      var msg = el('div', 'msg');
      var r = el('div', 'row'); r.style.marginTop = '12px';
      r.append(bt('حفظ واختبار', '', function () {
        if (!i.value.trim()) return; store.set(i.value.trim()); msg.className = 'msg'; msg.textContent = 'يختبر…';
        gh('').then(function (repo) {
          if (!repo.permissions || !repo.permissions.push) throw new Error('المفتاح يقرأ المستودع لكن ما يقدر يكتب فيه.');
          msg.className = 'msg ok'; msg.textContent = '✓ المفتاح شغّال ويقدر يكتب على ' + REPO; i.value = '';
          return load().then(function (d) { if (!dirty) data = d; });
        }).catch(function (e) { msg.className = 'msg err'; msg.textContent = e.message; });
      }), bt('مسح المفتاح', 'danger', function () { store.del(); msg.className = 'msg'; msg.textContent = 'انمسح المفتاح من هذا المتصفح.'; saveBtn.disabled = true; }));
      c.append(r, msg);
      if (store.get()) c.append(el('p', 'muted', 'فيه مفتاح محفوظ في هذا المتصفح.'));
    }
  };
  function draw() {
    var y = scrollY; ed.innerHTML = '';
    if (!store.get() && tab !== 'settings') { var n = el('div', 'notice'); n.innerHTML = 'تقدر تعدّل الحين، لكن عشان تحفظ تحتاج مفتاح GitHub. أضفه مرة وحدة من <a href="#" id="toSet">الإعدادات</a>.'; ed.append(n); n.querySelector('#toSet').onclick = function (e) { e.preventDefault(); go('settings'); }; }
    VIEWS[tab]();
    scrollTo(0, y);
  }
  function go(t) { tab = t; document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); }); scrollTo(0, 0); draw(); }
  document.querySelectorAll('#tabs button').forEach(function (b) { b.onclick = function () { go(b.dataset.t); }; });
  load().then(function (d) { data = d; draw(); }).catch(function (e) { ed.innerHTML = ''; ed.append(el('div', 'notice', e.message)); });
})();
</script>
</body>
</html>
